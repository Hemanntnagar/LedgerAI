[project]
name = "ledger"
version = "0.1.0"
description = "Ledger — store Action Center for Indian retail invoices"
requires-python = ">=3.12"
# Runtime deps also listed in requirements.txt for the Vercel Python builder.
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "starlette==1.3.1",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "SQLAlchemy==2.0.51",
    "PyYAML==6.0.3",
    "RapidFuzz==3.14.5",
    "python-multipart==0.0.20",
    "psycopg2-binary==2.9.10",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
build = "python deploy/vercel_build.py"
